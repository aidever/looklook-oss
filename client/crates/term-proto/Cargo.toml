[package]
name = "term-proto"
version = "0.1.0"
edition = "2021"
description = "looklook-term.v1 wire protocol, delta encoder/decoder, and streaming zstd codec (native + wasm32)"

[dependencies]
bincode = "=1.3.3"
bitflags = { version = "=2.13.2", features = ["serde"] }
serde = { version = "=1.0.229", features = ["derive"] }
ruzstd = "=0.8.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd = { version = "=0.14.4", default-features = false }

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
