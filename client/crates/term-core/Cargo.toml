[package]
name = "term-core"
version = "0.1.0"
edition = "2021"
description = "Terminal emulation core abstraction and alacritty_terminal backend for looklook-termd"

[dependencies]
alacritty_terminal = "=0.26.0"
bincode = "=1.3.3"
serde = { version = "=1.0.229", features = ["derive"] }
term-proto = { path = "../term-proto" }
vte = "=0.15.0"
zstd = { version = "=0.14.4", default-features = false }
