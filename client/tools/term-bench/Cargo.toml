[package]
name = "term-bench"
version = "0.1.0"
edition = "2021"
description = "第 0 步基准工具：直连 looklook gateway WS 测 ttyd+tmux 链路的回显延迟与下行字节数"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "connect", "rustls-tls-webpki-roots"] }
